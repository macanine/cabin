<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPICE desktop</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; color-scheme: dark; }
    body { display: grid; place-items: center; background: #111; }
    #screen { position: relative; }
    #screen canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
  </style>
  <script type="module" src="./viewer.js"></script>
</head>
<body>
  <div id="screen" aria-label="Guest desktop"></div>
</body>
</html>
