name: live

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

# Real VM suites use self-hosted runners with hardware virtualization and a
# prepared Ubuntu cloud image. The push workflow still checks packaged QEMU.
jobs:
  suites:
    name: ${{ matrix.suite }}
    if: vars.CABIN_LIVE_CI == 'true'
    runs-on: [self-hosted, macOS, cabin-live]
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        suite:
          - destroy_vm_live
          - workspace_live
          - gateway_vm_live
          - gateway_interface_live
          - kernel_vm_live
          - browser_live
          - chrome_vm_live
          - chrome_tunnel_vm_live
          - accounts_vm_live
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the guest daemon
        run: node scripts/build-agentd.mjs --target aarch64-unknown-linux-musl
      - name: Boot and exercise a real machine
        env:
          CABIN_TEST_IMAGE: ${{ secrets.CABIN_TEST_IMAGE }}
          CABIN_TEST_ENGINE_HOME: ${{ secrets.CABIN_TEST_ENGINE_HOME }}
          CABIN_TEST_AGENTD: ${{ secrets.CABIN_TEST_AGENTD }}
          CABIND_TEST_BIN: ${{ github.workspace }}/core/target/aarch64-unknown-linux-musl/release/cabind
        run: >-
          cargo test --manifest-path vm/Cargo.toml
          --test ${{ matrix.suite }}
          -- --ignored --test-threads=1 --nocapture

  windows-guest:
    if: vars.CABIN_WINDOWS_LIVE_CI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: windows-live-guest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip3 install ziglang cargo-zigbuild
      - run: node scripts/build-agentd.mjs --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: windows-live-cabind
          path: core/target/x86_64-unknown-linux-musl/release/cabind
          if-no-files-found: error

  windows:
    name: Windows Ubuntu reachability and sync (WHPX)
    needs: windows-guest
    runs-on: [self-hosted, Windows, X64, cabin-live]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-live-host
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-vendor.mjs --platform windows-x64
      - uses: actions/download-artifact@v4
        with:
          name: windows-live-cabind
          path: core/target/x86_64-unknown-linux-musl/release
      - name: Boot Ubuntu, sync and restart under WHPX
        shell: pwsh
        env:
          CABIN_TEST_IMAGE: ${{ vars.CABIN_WINDOWS_TEST_IMAGE }}
          CABIN_TEST_AGENTD: ${{ github.workspace }}/core/target/x86_64-unknown-linux-musl/release/cabind
          CABIN_VENDOR_DIR: ${{ github.workspace }}/build/vendor/windows-x64
          CABIN_TEST_ACCEL: whpx
        run: |
          if (!$env:CABIN_TEST_IMAGE -or !(Test-Path -LiteralPath $env:CABIN_TEST_IMAGE -PathType Leaf)) {
            throw 'Set CABIN_WINDOWS_TEST_IMAGE to a local Ubuntu amd64 qcow2 image'
          }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib sync::tests::vm_live::ubuntu_ssh_sync_and_restart -- --exact --ignored --nocapture
