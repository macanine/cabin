name: build

on:
  push:
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast, platform-independent gates. The host-only crates (vm, src-tauri)
  # are formatted and linted in the app jobs, where their toolchains exist.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            diagnostics
            usage
            ip-detection
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Frontend lint and types
        run: |
          npm run lint
          npx tsc --noEmit
      - name: rustfmt
        run: |
          for crate in core diagnostics usage ip-detection; do
            cargo fmt --manifest-path "$crate/Cargo.toml" --check
          done
      - name: clippy
        run: |
          for crate in core diagnostics usage ip-detection; do
            cargo clippy --manifest-path "$crate/Cargo.toml" --all-targets -- -D warnings
          done

  # The guest daemon is a static Linux binary. Linux builds both architectures
  # reliably with cargo-zigbuild, so the desktop jobs download it instead of
  # setting up zig on Windows or macOS.
  guest:
    name: guest (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            triple: aarch64-unknown-linux-musl
          - arch: x86_64
            triple: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: guest-${{ matrix.arch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install zig and cargo-zigbuild
        run: pip3 install ziglang cargo-zigbuild
      - name: Test the guest crates
        if: matrix.arch == 'x86_64'
        run: |
          cargo test --manifest-path core/Cargo.toml
          cargo test --locked --manifest-path diagnostics/Cargo.toml
          cargo test --manifest-path usage/Cargo.toml
          cargo test --manifest-path ip-detection/Cargo.toml
      - name: Build cabind
        run: node scripts/build-agentd.mjs --target ${{ matrix.triple }}
      - uses: actions/upload-artifact@v4
        with:
          name: cabind-${{ matrix.arch }}
          path: core/target/${{ matrix.triple }}/release/cabind
          if-no-files-found: error

  app:
    name: app (${{ matrix.name }})
    needs: guest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            guest: aarch64
            guest_triple: aarch64-unknown-linux-musl
            bundles: app,dmg
            artifact_path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            guest: x86_64
            guest_triple: x86_64-unknown-linux-musl
            bundles: nsis
            artifact_path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            vm
          key: app-${{ matrix.name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: rustfmt (vm, src-tauri)
        shell: bash
        run: |
          cargo fmt --manifest-path vm/Cargo.toml --check
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Restore vendored binaries
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: build/vendor-cache
          key: vendor-${{ matrix.name }}-${{ hashFiles('scripts/vendor.json', 'scripts/fetch-vendor.mjs') }}
      - name: Fetch vendored binaries
        run: node scripts/fetch-vendor.mjs --platform ${{ matrix.name }}

      - uses: actions/download-artifact@v4
        with:
          name: cabind-${{ matrix.guest }}
          path: core/target/${{ matrix.guest_triple }}/release
      - name: Mark cabind executable
        shell: bash
        run: chmod +x core/target/${{ matrix.guest_triple }}/release/cabind

      # Host-side crates, after the bundle resources exist (the src-tauri
      # build script checks them). core is covered by the guest job. Both
      # platforms run the same tests and both must pass.
      - name: cargo test (vm, src-tauri)
        shell: bash
        timeout-minutes: 25
        run: |
          cargo test --manifest-path vm/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: cargo clippy (vm, src-tauri)
        if: matrix.name == 'macos-arm64'
        shell: bash
        timeout-minutes: 20
        run: |
          cargo clippy --manifest-path vm/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build the app
        shell: bash
        env:
          CABIN_PREBUILT_CABIND: "1"
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Install Cabin and exercise packaged QEMU on Windows
        if: matrix.name == 'windows-x64'
        shell: pwsh
        timeout-minutes: 12
        env:
          CABIN_INSTALLER_GLOB: ${{ matrix.artifact_path }}
        run: |
          $installers = @(Get-ChildItem -Path $env:CABIN_INSTALLER_GLOB -File)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer; got $($installers.Count)" }
          $installDir = Join-Path $env:RUNNER_TEMP "cabin-smoke-$([guid]::NewGuid().ToString('N'))"
          # NSIS requires /D to be the last argument, with no quotes even for a path with spaces.
          $setup = Start-Process -FilePath $installers[0].FullName -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Cabin NSIS installer exited with $($setup.ExitCode)" }
          if (!(Test-Path -LiteralPath (Join-Path $installDir 'cabin-desktop.exe') -PathType Leaf)) {
            throw 'Cabin executable missing after installation'
          }
          $env:CABIN_VENDOR_DIR = Join-Path $installDir 'vendor'
          $resources = @{
            'cabind' = 'core/target/x86_64-unknown-linux-musl/release/cabind'
            'vendor/manifest.json' = 'build/vendor/windows-x64/manifest.json'
            'vendor/openssh/ssh.exe' = 'build/vendor/windows-x64/openssh/ssh.exe'
            'vendor/openssh/ssh-keygen.exe' = 'build/vendor/windows-x64/openssh/ssh-keygen.exe'
            'vendor/openssh/libcrypto.dll' = 'build/vendor/windows-x64/openssh/libcrypto.dll'
          }
          $repo = (Get-Location).Path
          foreach ($dir in @('vm/config', 'vm/assets')) {
            foreach ($file in (Get-ChildItem -LiteralPath $dir -Recurse -File)) {
              $relative = [System.IO.Path]::GetRelativePath($repo, $file.FullName)
              $resources[$relative] = $file.FullName
            }
          }
          foreach ($resource in $resources.GetEnumerator()) {
            $installedFile = Join-Path $installDir $resource.Key
            if (!(Test-Path -LiteralPath $installedFile -PathType Leaf)) { throw "Missing installed file: $installedFile" }
            if ((Get-FileHash -LiteralPath $installedFile).Hash -ne (Get-FileHash -LiteralPath $resource.Value).Hash) {
              throw "Installed file differs from packaging input: $installedFile"
            }
          }
          cargo test --locked --manifest-path vm/Cargo.toml --test windows_qemu_live -- --ignored --nocapture

      - uses: actions/upload-artifact@v4
        with:
          name: cabin-${{ matrix.name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
